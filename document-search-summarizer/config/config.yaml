# Single source of truth for all settings. Secrets live in .env, never here.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: indexes
  reports_dir: reports
  documents_file: data/processed/documents.parquet
  chunks_file: data/processed/chunks.parquet
  heldout_file: data/processed/heldout.parquet
  stats_file: reports/data_stats.json
  bm25_index: indexes/bm25.pkl
  tfidf_index: indexes/tfidf.pkl
  faiss_index: indexes/dense.faiss
  embeddings_file: indexes/embeddings.npy
  index_stats_file: reports/index_stats.json
  cache_dir: data/cache
  suggest_index: indexes/suggest.pkl
  figures_dir: reports/figures
  testset_file: reports/testset.csv
  search_metrics_file: reports/search_metrics.csv
  search_ranks_file: reports/search_ranks.csv
  summary_details_file: reports/summary_details.csv
  summary_scores_file: reports/summary_scores.csv
  human_eval_file: reports/human_eval_sheet.csv
  human_eval_scores_file: reports/human_eval_scores.json
  latency_file: reports/latency.csv
  metrics_summary_file: reports/metrics_summary.json

corpus:
  dataset_name: abisee/cnn_dailymail
  config_name: "3.0.0"
  train_docs: 20000          # searchable corpus size (train split); scale up here
  heldout_docs: 1000         # evaluation pool (test split), never mixed into the corpus
  min_words: 50              # drop articles shorter than this after cleaning
  near_dup_head_words: 40    # articles sharing their first N normalised words are near-duplicates
  title_max_chars: 150
  chunk_size: 200            # target words per chunk (sentence-aware)
  chunk_overlap: 40          # approx. words shared between neighbouring chunks

search:
  top_n: 5
  candidate_pool: 100        # candidates taken from each retriever before fusion
  mode: hybrid               # bm25 | dense | hybrid
  rrf_k: 60                  # reciprocal-rank-fusion constant
  weights:
    bm25: 0.5
    dense: 0.5
  excerpt_words: 60
  excerpts_per_doc: 2
  page_size: 5

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2   # 384-dim, CPU friendly
  batch_size: 64
  normalize: true
  max_seq_length: 256        # tokens; ~200-word chunks fit almost entirely
  checkpoint_every: 5000     # chunks per saved block (resume after interruption)

app:
  max_summary_docs: 5        # the app summarises at most this many top results (CPU LLM is slow)

finetune:                    # Phase 7: domain adaptation of the embedding model
  enabled: false             # true -> the app/search use the fine-tuned model and its own dense index
  num_pairs: 300             # (LLM query, passage) training pairs from TRAIN docs, never test docs
  query_doc_words: 150       # words of the article shown to the LLM (shorter = faster on CPU)
  batch_size: 32             # MultipleNegativesRankingLoss: other pairs in the batch are negatives
  epochs: 1
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  seed: 7
  model_dir: models/embedder_ft
  pairs_file: data/processed/finetune_pairs.csv
  embeddings_file: indexes/ft/embeddings.npy
  faiss_index: indexes/ft/dense.faiss
  comparison_file: reports/embedding_comparison.csv

suggest:
  min_count_unigram: 60      # an n-gram must occur this often in the corpus to be suggested
  min_count_bigram: 25
  min_count_trigram: 12
  max_title_chars: 90        # longer titles are not offered as completions
  limit: 8

index:
  bm25:
    k1: 1.5
    b: 0.75
  tfidf:
    ngram_range: [1, 1]
    min_df: 2
  faiss:
    type: flat               # flat (exact) | ivf | hnsw  -- ivf/hnsw = scalability path
    nlist: 256               # ivf: number of clusters (rule of thumb ~4*sqrt(N))
    nprobe: 16               # ivf: clusters visited per query
    hnsw_m: 32               # hnsw: graph neighbours
    ef_construction: 200     # hnsw: build-time effort
    ef_search: 64            # hnsw: query-time effort

llm:
  provider: ollama           # openai | ollama   (LLM_PROVIDER in .env overrides)
  timeout_seconds: 300       # CPU generation can be slow
  max_retries: 3
  backoff_seconds: 2         # doubles after each failed attempt
  temperature: 0.2
  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
  ollama:
    model: llama3.2:3b
    host: http://localhost:11434
    num_ctx: 4096            # context window requested from Ollama

summary:
  lengths:                   # target words per length choice
    short: 50
    medium: 120
    long: 250
  default_length: medium
  min_words: 20              # bounds for an exact word target
  max_words: 500
  map_words: 100             # size of each per-document summary in map-reduce
  max_input_tokens: 2800     # text budget per LLM call (prompt + output must fit num_ctx)
  tokens_per_word: 1.4       # conservative words->tokens estimate used for budgeting
  length_tolerance: 0.25     # accept summaries within +/-25% of the target
  length_retries: 1          # re-prompts when the length is off
  use_cache: true
  prompt_version: 1          # bump to invalidate cached summaries after changing prompts

evaluation:
  seed: 42
  test_docs: 200             # indexed documents used as search targets
  query_doc_words: 350       # words of the article shown to the LLM when it writes a query
  query_max_words: 12
  max_copied_run: 5          # reject queries copying this many consecutive words from the article
  k_values: [1, 5, 10]
  summary_eval_docs: 40      # test docs summarised per length for ROUGE (LLM on CPU is slow; set 200 for all)
  summary_lengths: [short, medium, long]
  human_eval_pool: 30        # fixed random pool of test queries for the human sheet
  human_eval_samples: 15     # rows actually generated (first n of the pool); 30 = full pool, ~40 min more
  human_eval_length: medium
  human_eval_top_docs: 3     # retrieved documents summarised together for the human sheet
  latency_repeats_index_load: 5

logging:
  level: INFO
